<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MET Police PRC | Login</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="login-body">
<div class="login-card">
  <div class="crest">MPS</div>
  <div class="eyebrow">METROPOLITAN POLICE SERVICE</div>
  <h1>Police Records & Communications</h1>
  <p class="muted">ERLC ROLEPLAY SYSTEM</p>
  <div id="error" class="error"></div>
  <label>Email</label>
  <input id="email" type="email" placeholder="Officer email" autocomplete="username">
  <label>Password</label>
  <input id="password" type="password" placeholder="Password" autocomplete="current-password">
  <button class="primary" onclick="login()">SIGN IN</button>
  <p class="tiny">Fictional roleplay system. Not an official Metropolitan Police database.</p>
</div>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
